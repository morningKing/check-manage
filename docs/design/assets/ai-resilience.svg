<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Resilience 恢复与账本一致性</title>
  <desc id="desc">DB 账本通过三层防线 Reconcile、Session Recovery、Retry &amp; Watchdog 和 orphan sweep 形成可观测的恢复闭环，并将任务分流到 succeeded、failed、cancelled 等终态。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6ea0ff"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#a48bff"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ffad5c"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6c7898"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0a1020"/>
  <rect x="28" y="28" width="1544" height="844" rx="24" fill="#0e1730" stroke="#24345e" stroke-width="2"/>
  <path d="M58 142 H1542" stroke="#263863" stroke-width="2"/>
  <rect x="58" y="58" width="10" height="54" rx="5" fill="#ff9d4d"/>
  <text x="88" y="86" fill="#f4f7ff" font-size="30" font-weight="700">AI Resilience 恢复与账本一致性</text>
  <text x="88" y="116" fill="#9eacd0" font-size="16">从 stale-running 识别到 orphan sweep：账本是事实，恢复动作可重放</text>

  <g aria-label="恢复闭环">
    <path d="M350 330 C420 210 550 160 690 168" stroke="#344a78" stroke-width="3" fill="none" stroke-dasharray="10 8"/>
    <path d="M930 190 C1090 178 1210 240 1270 360" stroke="#344a78" stroke-width="3" fill="none" stroke-dasharray="10 8"/>
    <path d="M1260 590 C1130 742 980 760 840 748" stroke="#344a78" stroke-width="3" fill="none" stroke-dasharray="10 8"/>
    <path d="M650 744 C500 744 360 640 320 520" stroke="#344a78" stroke-width="3" fill="none" stroke-dasharray="10 8"/>
    <text x="800" y="170" text-anchor="middle" fill="#65759b" font-size="12">observe</text>
    <text x="1275" y="282" text-anchor="middle" fill="#65759b" font-size="12">repair</text>
    <text x="1120" y="770" text-anchor="middle" fill="#65759b" font-size="12">verify</text>
    <text x="380" y="700" text-anchor="middle" fill="#65759b" font-size="12">reconcile</text>

    <rect x="70" y="310" width="360" height="282" rx="20" fill="#121e3b" stroke="#40598b" stroke-width="2"/>
    <rect x="70" y="278" width="360" height="26" rx="13" fill="#1b2d50" stroke="#5277be"/>
    <text x="250" y="297" text-anchor="middle" fill="#8fa9e3" font-size="12" font-weight="700">防线 1 · Reconcile</text>
    <rect x="96" y="342" width="308" height="92" rx="14" fill="#18284c" stroke="#5277be" stroke-width="2"/>
    <text x="122" y="378" fill="#6ea0ff" font-size="19" font-weight="700">DB 账本</text>
    <text x="122" y="406" fill="#dbe3fb" font-size="14">事实状态 · owner · cursor</text>
    <rect x="96" y="458" width="148" height="102" rx="12" fill="#1b2d50"/>
    <text x="116" y="488" fill="#8fa9e3" font-size="13">running</text>
    <text x="116" y="516" fill="#dbe3fb" font-size="13">job_042</text>
    <text x="116" y="542" fill="#6ea0ff" font-size="12">last_seen 12:04</text>
    <rect x="256" y="458" width="148" height="102" rx="12" fill="#201d4c"/>
    <text x="276" y="488" fill="#b9aef0" font-size="13">version</text>
    <text x="276" y="516" fill="#e5e0fa" font-size="13">v0042</text>
    <text x="276" y="542" fill="#a48bff" font-size="12">events 18</text>

    <rect x="540" y="178" width="390" height="164" rx="20" fill="#201d4c" stroke="#786bd0" stroke-width="2"/>
    <text x="570" y="220" fill="#a48bff" font-size="20" font-weight="700">stale-running reconcile</text>
    <text x="570" y="250" fill="#e5e0fa" font-size="14">扫描超时心跳与未闭合 Attempt</text>
    <path d="M570 276 H900" stroke="#5d56a3" stroke-width="1"/>
    <text x="570" y="302" fill="#aba3d5" font-size="13">running + stale → recoverable</text>
    <text x="570" y="324" fill="#8e86bd" font-size="12">不直接删除，先标记原因</text>

    <rect x="578" y="390" width="352" height="180" rx="20" fill="#172d4b" stroke="#5277be" stroke-width="2"/>
    <rect x="578" y="358" width="352" height="26" rx="13" fill="#1b2d50" stroke="#5277be"/>
    <text x="754" y="377" text-anchor="middle" fill="#8fa9e3" font-size="12" font-weight="700">防线 2 · Session Recovery</text>
    <text x="608" y="432" fill="#6ea0ff" font-size="20" font-weight="700">OpenCode recovery</text>
    <text x="608" y="461" fill="#dbe3fb" font-size="14">重新连接、恢复游标、继续执行</text>
    <rect x="608" y="485" width="92" height="34" rx="17" fill="#263e72"/>
    <text x="654" y="507" text-anchor="middle" fill="#dbe3fb" font-size="12">attach</text>
    <rect x="712" y="485" width="92" height="34" rx="17" fill="#302866"/>
    <text x="758" y="507" text-anchor="middle" fill="#e3dcfa" font-size="12">rehydrate</text>
    <rect x="816" y="485" width="92" height="34" rx="17" fill="#3a2a31"/>
    <text x="862" y="507" text-anchor="middle" fill="#ffd9c1" font-size="12">resume</text>
    <text x="608" y="548" fill="#8f9cbb" font-size="12">恢复动作写回 DB 账本</text>

    <rect x="542" y="632" width="392" height="148" rx="20" fill="#33233b" stroke="#ca774a" stroke-width="2"/>
    <rect x="542" y="600" width="392" height="26" rx="13" fill="#4b3030" stroke="#ca774a"/>
    <text x="738" y="619" text-anchor="middle" fill="#ffd9c1" font-size="12" font-weight="700">防线 3 · Retry &amp; Watchdog</text>
    <text x="572" y="674" fill="#ffad5c" font-size="20" font-weight="700">retry / watchdog</text>
    <text x="572" y="704" fill="#f4d8c6" font-size="14">有限重试、退避、心跳监督</text>
    <rect x="572" y="728" width="122" height="30" rx="15" fill="#4b3030"/>
    <text x="633" y="748" text-anchor="middle" fill="#ffd9c1" font-size="12">attempt 2 / 3</text>
    <rect x="706" y="728" width="92" height="30" rx="15" fill="#4b3030"/>
    <text x="752" y="748" text-anchor="middle" fill="#ffd9c1" font-size="12">backoff</text>
    <rect x="810" y="728" width="92" height="30" rx="15" fill="#4b3030"/>
    <text x="856" y="748" text-anchor="middle" fill="#ffd9c1" font-size="12">timeout</text>

    <rect x="1080" y="310" width="400" height="282" rx="20" fill="#121e3b" stroke="#40598b" stroke-width="2"/>
    <rect x="1108" y="342" width="344" height="92" rx="14" fill="#202a43" stroke="#56627f" stroke-width="2"/>
    <text x="1136" y="378" fill="#cfd6e5" font-size="20" font-weight="700">orphan sweep</text>
    <text x="1136" y="406" fill="#d0d6e4" font-size="14">找出无 owner / 无父级 / 无连接的对象</text>
    <rect x="1108" y="458" width="344" height="102" rx="12" fill="#18233c"/>
    <text x="1134" y="488" fill="#8f9cbb" font-size="13">候选 orphan</text>
    <text x="1134" y="516" fill="#dbe3fb" font-size="13">session_17 · event_901</text>
    <text x="1134" y="542" fill="#9aa6bf" font-size="12">隔离 → 记录 → 清理</text>

    <path d="M430 452 C470 452 500 452 578 452" stroke="#6ea0ff" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
    <path d="M735 342 V390" stroke="#a48bff" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <path d="M930 480 C990 480 1018 442 1108 388" stroke="#ffad5c" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
    <path d="M1250 592 C1250 636 1120 660 934 680" stroke="#6c7898" stroke-width="2" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>
    <path d="M740 632 V570" stroke="#ffad5c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M542 704 C480 690 430 620 430 530" stroke="#6c7898" stroke-width="2" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow-muted)"/>
  </g>

  <g aria-label="恢复规则">
    <rect x="1000" y="632" width="480" height="148" rx="20" fill="#111a35" stroke="#6559a8" stroke-width="2"/>
    <text x="1030" y="658" fill="#c3bdf0" font-size="17" font-weight="700">终态分流 Final states</text>
    <rect x="1150" y="668" width="160" height="26" rx="13" fill="#26304d" stroke="#6c7898"/>
    <text x="1230" y="686" text-anchor="middle" fill="#d0d6e4" font-size="11" font-weight="700">恢复/重试结果</text>
    <rect x="1030" y="710" width="126" height="40" rx="20" fill="#1b2d50" stroke="#5277be"/>
    <text x="1093" y="735" text-anchor="middle" fill="#dbe3fb" font-size="13" font-weight="700">succeeded</text>
    <rect x="1172" y="710" width="108" height="40" rx="20" fill="#33233b" stroke="#ca774a"/>
    <text x="1226" y="735" text-anchor="middle" fill="#f4d8c6" font-size="13" font-weight="700">failed</text>
    <rect x="1296" y="710" width="130" height="40" rx="20" fill="#202a43" stroke="#56627f"/>
    <text x="1361" y="735" text-anchor="middle" fill="#d0d6e4" font-size="13" font-weight="700">cancelled</text>
    <path d="M934 706 C1000 706 1060 682 1150 682" stroke="#6c7898" stroke-width="3" fill="none" marker-end="url(#arrow-muted)"/>
    <text x="1010" y="689" text-anchor="middle" fill="#7f8dad" font-size="11">结果写回</text>
    <path d="M1180 694 C1144 700 1093 704 1093 710" stroke="#6ea0ff" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
    <text x="1060" y="704" text-anchor="middle" fill="#8fa9e3" font-size="11">成功</text>
    <path d="M1230 694 V710" stroke="#ffad5c" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
    <text x="1230" y="704" text-anchor="middle" fill="#ffd9c1" font-size="11">预算耗尽</text>
    <path d="M1280 694 C1320 700 1361 704 1361 710" stroke="#6c7898" stroke-width="3" fill="none" marker-end="url(#arrow-muted)"/>
    <text x="1400" y="704" text-anchor="middle" fill="#aab4cc" font-size="11">用户取消</text>
  </g>

  <g aria-label="图例">
    <rect x="70" y="820" width="1410" height="24" rx="12" fill="#111b34"/>
    <circle cx="100" cy="832" r="6" fill="#6ea0ff"/>
    <text x="114" y="837" fill="#b8c5e3" font-size="12">事实与状态</text>
    <circle cx="228" cy="832" r="6" fill="#a48bff"/>
    <text x="242" y="837" fill="#b8c5e3" font-size="12">识别与重建</text>
    <circle cx="366" cy="832" r="6" fill="#ffad5c"/>
    <text x="380" y="837" fill="#b8c5e3" font-size="12">恢复与重试</text>
    <text x="1448" y="837" text-anchor="end" fill="#7080a5" font-size="12">observe → repair → verify</text>
  </g>
</svg>
