<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Chat 上下文与实时消息流</title>
  <desc id="desc">Chat、@文件与 Agent 进入上下文水位线，经 ContextStatusBar 与 Flask SSE / OpenCode 处理后完成消息持久化和通知；文本附件内联，二进制附件经 read_upload / 工具读取。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6ea0ff"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#a48bff"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ffad5c"/>
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6c7898"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0a1020"/>
  <rect x="28" y="28" width="1544" height="844" rx="24" fill="#0e1730" stroke="#24345e" stroke-width="2"/>
  <path d="M58 142 H1542" stroke="#263863" stroke-width="2"/>
  <rect x="58" y="58" width="10" height="54" rx="5" fill="#ff9d4d"/>
  <text x="88" y="86" fill="#f4f7ff" font-size="30" font-weight="700">AI Chat 上下文与实时消息流</text>
  <text x="88" y="116" fill="#9eacd0" font-size="16">从输入意图到可恢复消息：Chat / @文件 / Agent → Context Waterline → Flask SSE / OpenCode</text>

  <g aria-label="输入层">
    <rect x="70" y="188" width="350" height="548" rx="20" fill="#121e3b" stroke="#40598b" stroke-width="2"/>
    <rect x="70" y="188" width="350" height="58" rx="20" fill="#1b2c55"/>
    <rect x="70" y="224" width="350" height="22" fill="#1b2c55"/>
    <circle cx="102" cy="217" r="12" fill="#6ea0ff"/>
    <path d="M96 215 Q102 207 108 215 V224 H96 Z" fill="#0e1730"/>
    <text x="128" y="224" fill="#f4f7ff" font-size="20" font-weight="700">用户输入层</text>
    <text x="96" y="278" fill="#aeb9d6" font-size="14">意图、上下文与工具指向</text>

    <rect x="94" y="310" width="302" height="82" rx="14" fill="#18284c" stroke="#5277be" stroke-width="2"/>
    <circle cx="124" cy="341" r="16" fill="#6ea0ff"/>
    <path d="M116 336 Q124 328 132 336 V348 Q124 355 116 348 Z" fill="#0e1730"/>
    <text x="152" y="340" fill="#f4f7ff" font-size="18" font-weight="700">Chat</text>
    <text x="152" y="366" fill="#aeb9d6" font-size="14">消息、追问、停止信号</text>

    <rect x="94" y="414" width="302" height="82" rx="14" fill="#201d4c" stroke="#8b78df" stroke-width="2"/>
    <circle cx="124" cy="445" r="16" fill="#a48bff"/>
    <text x="124" y="451" text-anchor="middle" fill="#0e1730" font-size="19" font-weight="700">@</text>
    <text x="152" y="444" fill="#f4f7ff" font-size="18" font-weight="700">@文件 / Agent</text>
    <text x="152" y="470" fill="#b8b2df" font-size="14">引用文件、角色与能力</text>

    <rect x="94" y="518" width="302" height="118" rx="14" fill="#17223e" stroke="#344a78" stroke-width="2"/>
    <text x="118" y="550" fill="#ffad5c" font-size="16" font-weight="700">Message envelope</text>
    <text x="118" y="579" fill="#dbe3fb" font-size="14">conversation_id</text>
    <text x="118" y="604" fill="#dbe3fb" font-size="14">attachments + agent_hint</text>
    <path d="M118 616 H368" stroke="#3a4b76" stroke-width="1"/>
    <text x="118" y="628" fill="#7f8dad" font-size="12">统一进入上下文编排</text>

    <path d="M420 340 C448 340 448 352 474 352" stroke="#6ea0ff" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
    <path d="M420 454 C448 454 448 438 474 438" stroke="#a48bff" stroke-width="3" fill="none" marker-end="url(#arrow-purple)"/>
    <path d="M420 576 C448 576 448 534 474 534" stroke="#ffad5c" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  </g>

  <g aria-label="上下文层">
    <rect x="474" y="188" width="414" height="548" rx="20" fill="#111a35" stroke="#6559a8" stroke-width="2"/>
    <rect x="474" y="188" width="414" height="58" rx="20" fill="#2a245d"/>
    <rect x="474" y="224" width="414" height="22" fill="#2a245d"/>
    <circle cx="506" cy="217" r="12" fill="#a48bff"/>
    <path d="M500 211 H512 M500 217 H512 M500 223 H509" stroke="#0e1730" stroke-width="2"/>
    <text x="532" y="224" fill="#f4f7ff" font-size="20" font-weight="700">Context Window</text>
    <text x="500" y="278" fill="#c3bdf0" font-size="14">上下文水位线 / Context Waterline</text>

    <rect x="500" y="304" width="362" height="72" rx="12" fill="#1b2d50" stroke="#4f73b4" stroke-width="1.5"/>
    <text x="524" y="334" fill="#6ea0ff" font-size="15" font-weight="700">SYSTEM</text>
    <text x="524" y="357" fill="#dbe3fb" font-size="14">系统规则 · 项目边界 · 安全约束</text>

    <rect x="500" y="388" width="172" height="68" rx="12" fill="#201d4c" stroke="#786bd0" stroke-width="1.5"/>
    <text x="522" y="417" fill="#a48bff" font-size="15" font-weight="700">HISTORY</text>
    <text x="522" y="440" fill="#d7d1f1" font-size="13">历史消息摘要</text>
    <rect x="690" y="388" width="172" height="68" rx="12" fill="#201d4c" stroke="#786bd0" stroke-width="1.5"/>
    <text x="712" y="417" fill="#a48bff" font-size="15" font-weight="700">REFERENCES</text>
    <text x="712" y="440" fill="#d7d1f1" font-size="13">@文件 · Agent 指令</text>

    <path d="M500 486 H862" stroke="#ffad5c" stroke-width="3" stroke-dasharray="10 7"/>
    <rect x="616" y="468" width="132" height="34" rx="17" fill="#ff9d4d"/>
    <text x="682" y="491" text-anchor="middle" fill="#24150b" font-size="14" font-weight="700">水位线 WATERLINE</text>

    <rect x="500" y="526" width="362" height="82" rx="12" fill="#1b243e" stroke="#405477" stroke-width="1.5"/>
    <text x="524" y="557" fill="#ffad5c" font-size="15" font-weight="700">COMPACT</text>
    <text x="524" y="582" fill="#dbe3fb" font-size="14">摘要 / 裁剪 / token 预算</text>
    <text x="524" y="601" fill="#8f9cbb" font-size="12">超出水位线 → 保留证据，压缩细节</text>

    <rect x="500" y="632" width="362" height="78" rx="12" fill="#33233b" stroke="#ca774a" stroke-width="2"/>
    <text x="524" y="661" fill="#ffad5c" font-size="16" font-weight="700">ContextStatusBar</text>
    <text x="524" y="686" fill="#f4d8c6" font-size="13">token 水位 · attachments · stream 状态</text>

    <path d="M888 352 C918 352 918 352 950 352" stroke="#a48bff" stroke-width="3" fill="none" marker-end="url(#arrow-purple)"/>
    <text x="919" y="337" text-anchor="middle" fill="#9eacd0" font-size="12">编排后请求</text>
    <path d="M681 608 V632" stroke="#ffad5c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M500 671 C462 671 450 650 430 628" stroke="#ffad5c" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
    <text x="452" y="658" text-anchor="middle" fill="#c59f89" font-size="11">附件状态</text>
  </g>

  <g aria-label="运行时与输出层">
    <rect x="950" y="188" width="580" height="548" rx="20" fill="#121e3b" stroke="#40598b" stroke-width="2"/>
    <rect x="978" y="226" width="218" height="104" rx="16" fill="#1b2d50" stroke="#5277be" stroke-width="2"/>
    <text x="1002" y="261" fill="#6ea0ff" font-size="16" font-weight="700">Flask SSE</text>
    <text x="1002" y="289" fill="#dbe3fb" font-size="14">实时事件流</text>
    <text x="1002" y="311" fill="#8f9cbb" font-size="12">connect · stream · close</text>

    <rect x="1230" y="226" width="270" height="104" rx="16" fill="#241e4b" stroke="#8b78df" stroke-width="2"/>
    <text x="1254" y="261" fill="#a48bff" font-size="16" font-weight="700">OpenCode</text>
    <text x="1254" y="289" fill="#e5e0fa" font-size="14">模型执行与工具调用</text>
    <text x="1254" y="311" fill="#aba3d5" font-size="12">prompt → delta → done</text>

    <path d="M1196 278 H1230" stroke="#6ea0ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="1212" y="263" text-anchor="middle" fill="#8192b7" font-size="12">SSE</text>

    <rect x="978" y="382" width="522" height="122" rx="16" fill="#172640" stroke="#5277be" stroke-width="2"/>
    <circle cx="1010" cy="419" r="14" fill="#6ea0ff"/>
    <path d="M1003 414 H1017 V425 H1003 Z" fill="#0e1730"/>
    <text x="1038" y="424" fill="#f4f7ff" font-size="18" font-weight="700">消息持久化 Message Persistence</text>
    <text x="1010" y="458" fill="#c4d1ed" font-size="14">conversation / message / event / usage</text>
    <text x="1010" y="482" fill="#8f9cbb" font-size="12">先落账，再广播；断线后可恢复当前状态</text>

    <rect x="978" y="520" width="522" height="112" rx="16" fill="#201d4c" stroke="#786bd0" stroke-width="2"/>
    <text x="1006" y="552" fill="#a48bff" font-size="16" font-weight="700">附件分支 Attachment routing</text>
    <rect x="1006" y="570" width="218" height="42" rx="12" fill="#1b2d50" stroke="#5277be"/>
    <text x="1115" y="596" text-anchor="middle" fill="#dbe3fb" font-size="13">文本附件 → 内联上下文</text>
    <rect x="1240" y="570" width="232" height="42" rx="12" fill="#33233b" stroke="#ca774a"/>
    <text x="1356" y="590" text-anchor="middle" fill="#f4d8c6" font-size="12">二进制附件 → read_upload</text>
    <text x="1356" y="606" text-anchor="middle" fill="#c59f89" font-size="11">/ 工具读取</text>

    <rect x="978" y="648" width="252" height="64" rx="16" fill="#33233b" stroke="#ca774a" stroke-width="2"/>
    <text x="1004" y="676" fill="#ffad5c" font-size="16" font-weight="700">通知 Notifications</text>
    <text x="1004" y="699" fill="#f4d8c6" font-size="12">完成 / 失败 / 需要确认</text>

    <rect x="1250" y="648" width="250" height="64" rx="16" fill="#172640" stroke="#40598b" stroke-width="2"/>
    <text x="1276" y="676" fill="#6ea0ff" font-size="16" font-weight="700">可恢复状态</text>
    <text x="1276" y="699" fill="#dbe3fb" font-size="12">stream cursor / last event</text>

    <path d="M1365 330 V382" stroke="#a48bff" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <path d="M1120 330 V382" stroke="#6ea0ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M1100 504 V520" stroke="#ffad5c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M1115 554 V570" stroke="#6ea0ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M1356 554 V570" stroke="#ffad5c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M862 671 C920 671 928 576 978 576" stroke="#a48bff" stroke-width="3" fill="none" marker-end="url(#arrow-purple)"/>
    <text x="910" y="652" text-anchor="middle" fill="#9eacd0" font-size="11">状态与附件元数据</text>
    <path d="M1360 632 V648" stroke="#6ea0ff" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <path d="M1100 632 V648" stroke="#ffad5c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <path d="M978 680 C920 680 920 690 820 690" stroke="#6c7898" stroke-width="2" fill="none" stroke-dasharray="7 7" marker-end="url(#arrow-muted)"/>
    <text x="890" y="680" text-anchor="middle" fill="#7f8dad" font-size="12">事件回放</text>
  </g>

  <g aria-label="图例">
    <rect x="70" y="790" width="1460" height="50" rx="14" fill="#111b34" stroke="#263863"/>
    <circle cx="102" cy="815" r="7" fill="#6ea0ff"/>
    <text x="118" y="821" fill="#b8c5e3" font-size="13">实时通道</text>
    <circle cx="252" cy="815" r="7" fill="#a48bff"/>
    <text x="268" y="821" fill="#b8c5e3" font-size="13">上下文编排</text>
    <circle cx="424" cy="815" r="7" fill="#ffad5c"/>
    <text x="440" y="821" fill="#b8c5e3" font-size="13">持久化与通知</text>
    <text x="1450" y="821" text-anchor="end" fill="#7080a5" font-size="13">落账 → 广播 → 可恢复</text>
  </g>
</svg>
