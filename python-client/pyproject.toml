[project]
name = "check-manage-openapi-client"
version = "0.2.0"
description = "check-manage Open API 的官方 Python 客户端：集合读写、分支、文件上传/下载，以及 AI 批任务、行操作触发、AI 定时任务、Prompt 模板、长期记忆管理"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["checkmanage_openapi*"]
