[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short -m "not stress"
markers =
    stress: AI 压力测试（专属压测栈，pytest -m stress 显式触发）
    data_full: 数据管理全量 E2E（live-server，:5173 代理栈不在则 skip）
    slow: 慢用例（单例 >30s，ETL 异步轮询/webhook 同步/行动作轮询）；fast 层用 -m "not slow"
